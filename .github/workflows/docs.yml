# Build the documentation site on pull requests and upload it as an artifact
# for preview. Publishing to GitHub Pages happens in pages.yml on push to main.
name: Docs

on:
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # figures are pre-rendered and committed under docs/figures, so the
          # build needs neither data/ nor an ENSDF distribution
          sparse-checkout: |
            src
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[docs]'
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
